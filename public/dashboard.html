<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Audit Dashboard</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>GitHub Audit Dashboard</h1>
    <form action="/auth/logout" method="get"><button type="submit" class="logout-btn">Logout</button></form>
  </header>

  <main id="app">
    <div id="rate-limit-banner" class="rate-limit-banner" hidden></div>
    <div id="partial-banner" class="partial-banner" hidden>
      Result set is partial due to GitHub API rate limiting — not all repositories could be loaded.
    </div>
    <div id="loading" class="loading">Loading repositories from GitHub…</div>
    <div id="error" class="error-banner" hidden></div>

    <section id="summary" class="summary" hidden>
      <div class="stat"><span class="stat-value" id="stat-total">0</span><span class="stat-label">Total repos</span></div>
      <div class="stat"><span class="stat-value" id="stat-public">0</span><span class="stat-label">Public</span></div>
      <div class="stat"><span class="stat-value" id="stat-private">0</span><span class="stat-label">Private</span></div>
      <div class="stat"><span class="stat-value" id="stat-stars">0</span><span class="stat-label">Total stars</span></div>
      <div class="stat"><span class="stat-value" id="stat-forks">0</span><span class="stat-label">Total forks</span></div>
      <div class="stat stat-languages"><span class="stat-label">Languages</span><div id="stat-language-list"></div></div>
    </section>

    <div id="table-scroll" class="table-scroll">
    <table id="repo-table" class="repo-table" hidden>
      <thead>
        <tr>
          <th scope="col" data-key="name" data-type="string"><button type="button" class="sort-btn">Name<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="owner" data-type="string"><button type="button" class="sort-btn">Owner<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="description" data-type="string"><button type="button" class="sort-btn">Description<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="visibility" data-type="string"><button type="button" class="sort-btn">Visibility<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="primaryLanguage" data-type="string"><button type="button" class="sort-btn">Primary language<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="languages" data-type="string"><button type="button" class="sort-btn">Languages<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="stars" data-type="number"><button type="button" class="sort-btn">Stars<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="forks" data-type="number"><button type="button" class="sort-btn">Forks<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="watchers" data-type="number"><button type="button" class="sort-btn">Watchers<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="openIssuesCount" data-type="number"><button type="button" class="sort-btn">Open issues<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="openPullRequestsCount" data-type="number"><button type="button" class="sort-btn">Open PRs<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="size" data-type="number"><button type="button" class="sort-btn">Size (KB)<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="defaultBranch" data-type="string"><button type="button" class="sort-btn">Default branch<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="license" data-type="string"><button type="button" class="sort-btn">License<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="archived" data-type="string"><button type="button" class="sort-btn">Archived<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="disabled" data-type="string"><button type="button" class="sort-btn">Disabled<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="createdAt" data-type="date"><button type="button" class="sort-btn">Created<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="updatedAt" data-type="date"><button type="button" class="sort-btn">Updated<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="pushedAt" data-type="date"><button type="button" class="sort-btn">Last push<span class="sort-indicator" aria-hidden="true"></span></button></th>
          <th scope="col" data-key="lastCommitDate" data-type="date"><button type="button" class="sort-btn">Last commit<span class="sort-indicator" aria-hidden="true"></span></button></th>
        </tr>
      </thead>
      <tbody id="repo-table-body"></tbody>
    </table>
    </div>

    <div id="empty-state" class="empty-state" hidden>No accessible repositories were found for this account.</div>
  </main>

  <script src="/sort.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
